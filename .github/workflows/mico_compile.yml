name: MICO Compile and Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Registry
        run: |
          if [ -f registry/registry.json ]; then
            python3 -c "import json; reg=json.load(open('registry/registry.json')); print(f'Agents: {len(reg.get(\"agents\",[]))}')"
          else
            echo "registry/registry.json tidak ada — skip"
          fi

      - name: Run Integrity Check
        run: |
          if [ -f registry/registry.json ]; then
            sha256sum registry/registry.json > integrity.sha256
            cat integrity.sha256
          else
            echo "no registry — nothing to hash" > integrity.sha256
          fi

      - name: Generate MJMR Final Report
        run: |
          {
            echo "MJMR FINAL REPORT"
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: ${{ github.sha }}"
            echo "Status: COMPILATION SUCCESS"
          } > MJMR_FINAL_REPORT.md
          cat MJMR_FINAL_REPORT.md

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mico-artifacts
          path: |
            MJMR_FINAL_REPORT.md
            integrity.sha256
          if-no-files-found: warn