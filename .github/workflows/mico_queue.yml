name: MICO Queue Worker

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job type'
        required: true
        default: 'translate'
      target_lang:
        description: 'Target language'
        required: false
        default: 'id'
      text:
        description: 'Text to process'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Process job
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOB_TYPE: ${{ inputs.job_type }}
          TARGET_LANG: ${{ inputs.target_lang }}
          JOB_TEXT: ${{ inputs.text }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/worker.py
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/
          git commit -m "result: ${{ github.run_id }}" || echo "no changes"
          git push