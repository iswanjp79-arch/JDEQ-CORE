name: JDEQ Compute Mesh
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Perintah'
        required: true
        default: 'date && echo "✅ Compute Mesh" && uname -a'
jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Jalankan tugas
        run: |
          ${{ github.event.inputs.task }} > output.txt 2>&1
          cat output.txt
      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: compute-result
          path: output.txt
