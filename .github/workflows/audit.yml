name: JDEQ Foundation Audit
on: [push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi registry.json
        run: python3 -m json.tool registry/registry.json > /dev/null && echo "✅ registry.json valid"
      - name: Cek ADR tersedia
        run: |
          count=$(ls audit/ADR-*.md 2>/dev/null | wc -l)
          echo "ADR ditemukan: $count"
          [ "$count" -ge 1 ] || exit 1
