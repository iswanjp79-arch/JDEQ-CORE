aturan_manifest:
  benar: |
    $Hash = (Get-FileHash -LiteralPath $TargetFile -Algorithm SHA256).Hash
    "$Hash  $NamaBerkas" | Out-File -FilePath $ManifestFile -Encoding utf8 -Append
  salah: |
    "$Hash  $NamaBerkas" | Out-File -FilePath $ManifestFile -Encoding utf8
  prinsip:
    - "Manifest = buku catatan kronologis kekal, bukan nilai tunggal"
    - "Setiap entri baru = baris tambahan di bawah, bukan pengganti"
    - "Riwayat lama = bukti tak terhapus — syarat audit & provenance"
    - "Jika berkas diperbarui → entri baru ditambah → riwayat lama tetap terbaca"

