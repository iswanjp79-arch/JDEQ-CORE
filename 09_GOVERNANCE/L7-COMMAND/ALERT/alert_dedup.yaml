# alert_dedup.yaml
deduplication:
  enabled: true
  window_seconds: 300
  key_fields:
    - event_id
    - source
suppression:
  maintenance_windows:
    - name: "weekly_maintenance"
      start: "2026-01-01T02:00:00Z"
      end: "2026-12-31T03:00:00Z"
      recurrence: "FREQ=WEEKLY;BYDAY=SUN;BYHOUR=2"
