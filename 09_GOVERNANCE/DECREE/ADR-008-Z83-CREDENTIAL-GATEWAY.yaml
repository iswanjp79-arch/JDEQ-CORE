# ADR-008 - PEMINDAHAN KREDENSIAL KE Z83

## Status
DITERIMA · DIKUNCI · TIDAK DIUBAH

## Tanggal
16 September 2026

## Konteks
- Kunci API dan token tersebar di PC-i5, folder karantina, dan backup
- Setiap agen yang terlibat berisiko menerima atau menampilkan kunci
- Jika PC-i5 terekspos, SEMUA kunci ikut terekspos

## Keputusan
1. Z83 (`100.67.36.31`) = satu-satunya tempat penyimpanan kunci aktif
2. Brankas: `/mnt/secure-vault` dengan izin 0700, owner z83-admin:mico-gate
3. Karantina dari Vivo Y28 dipindah ke `/mnt/secure-vault/karantina-vivo-y28/`
4. PC-i5 = peminta. Tidak menyimpan kunci permanen
5. Verifikasi hash SHA-256 wajib sebelum hapus salinan lama

## Bukti
- 48 file dipindah (24 karantina-0545 + 24 karantina-0547-FULL)
- 24 hash unik terverifikasi identik PC-i5 vs Z83 (Compare-Object kosong)
- PC-i5 steril setelah transfer

