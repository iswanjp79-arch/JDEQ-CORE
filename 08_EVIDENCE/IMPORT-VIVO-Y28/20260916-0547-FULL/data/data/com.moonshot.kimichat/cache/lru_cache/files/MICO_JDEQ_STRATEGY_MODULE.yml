  batas:
    boleh_otomatis: ["MENGUMPULKAN","MEMERIKSA","MENCATAT","MENYUSUN BUKTI"]
    dilarang_otomatis: ["MEMUTUSKAN","MENGUBAH ATURAN","MENGIRIM DATA KE LUAR"]
  tingkat: {E0: "MANUAL", E1: "DIBANTU", E2: "BERBASIS ATURAN", E3: "DIAWASI", E4: "OTOMATIS BERSYARAT", E5: "ADAPTIF"}
  aturan: "E4/E5 hanya untuk pekerjaan yang risikonya terukur dan terkendali."
  rel_final: "Tidak ada otomatisasi tanpa batas. Tidak ada keputusan tanpa bukti. Tidak ada eksekusi tanpa kontrak. Tidak ada penerimaan tanpa verifikasi."

